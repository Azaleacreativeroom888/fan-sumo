<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画帖 | 土俵の書</title>
<meta name="description" content="取組の一場面、力士の姿、波と土俵をめぐるスケッチをまとめた画帖。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f0dc;
    --cream-2:#efe3c2;
    --cream-3:#e4d5a8;
    --black:#1c140b;
    --brown:#5c4c33;
    --brown-soft:#7a6847;
    --gold:#d99a1f;
    --gold-deep:#a8720f;
    --gold-bright:#e9b73a;
    --serif:'Shippori Mincho B1', serif;
    --sans:'Zen Kaku Gothic New', sans-serif;
    --body:'Noto Sans JP', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--cream);color:var(--black);font-family:var(--body);line-height:1.9;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;max-width:100%;}
  ::selection{background:var(--gold);color:var(--black);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  .eyebrow{
    font-family:var(--sans);font-size:.72rem;letter-spacing:.32em;color:var(--gold-deep);
    text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--gold-deep);display:inline-block;}
  h1,h2,h3{font-family:var(--serif);font-weight:800;color:var(--black);}

  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
    background:linear-gradient(to bottom, rgba(247,240,220,.94), rgba(247,240,220,0));
    backdrop-filter:blur(2px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:34px;height:34px;flex-shrink:0;}
  .brand .label{display:flex;flex-direction:column;line-height:1.1;}
  .brand .ja{font-family:var(--serif);font-weight:800;font-size:1.15rem;color:var(--black);letter-spacing:.04em;}
  .brand .en{font-family:var(--sans);font-size:.58rem;letter-spacing:.26em;color:var(--gold-deep);margin-top:3px;}
  nav.mainnav{display:flex;align-items:center;gap:34px;}
  nav.mainnav a{font-family:var(--sans);font-size:.86rem;letter-spacing:.08em;color:var(--brown);position:relative;padding-bottom:4px;transition:color .25s ease;}
  nav.mainnav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold-deep);transition:width .3s ease;}
  nav.mainnav a:hover{color:var(--black);}
  nav.mainnav a:hover::after{width:100%;}
  nav.mainnav a.current{color:var(--gold-deep);}
  .menu-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px;}
  .menu-toggle span{width:22px;height:2px;background:var(--black);display:block;}

  .page-header{padding:150px 0 60px;position:relative;border-bottom:1px solid rgba(28,20,11,.12);}
  .page-header h1{font-size:clamp(2.2rem,5vw,3.2rem);margin:18px 0 20px;}
  .page-header p{max-width:520px;color:var(--brown);}
  .header-strip{margin-top:44px;opacity:.8;}

  section{position:relative;padding:80px 0 110px;}

  /* ---------- gallery grid ---------- */
  .gallery-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:220px;
    gap:20px;
  }
  .gallery-grid .tall{grid-row:span 2;}
  .frame{
    position:relative;
    background:var(--cream-2);
    border:1.5px dashed var(--cream-3);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:20px;
    transition:border-color .3s ease, background .3s ease;
  }
  .frame:hover{border-color:var(--gold-deep);background:var(--cream);}
  .frame .icon{width:56px;height:56px;opacity:.85;}
  .frame .tag{
    font-family:var(--sans);font-size:.68rem;letter-spacing:.14em;color:var(--gold-deep);
    text-transform:uppercase;
  }
  .frame .cap{
    font-family:var(--sans);font-size:.72rem;color:var(--brown-soft);letter-spacing:.02em;
  }
  /* NOTE: 画像を追加する際は .frame の中身を <img src="..." alt="..."> に差し替えてください */

  .note-box{
    margin-top:56px;
    padding:26px 30px;
    background:var(--cream-2);
    border-left:3px solid var(--gold-deep);
    max-width:640px;
  }
  .note-box p{color:var(--brown);font-size:.9rem;}

  footer{padding:60px 0 40px;border-top:1px solid rgba(28,20,11,.12);}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;}
  footer nav{display:flex;gap:24px;flex-wrap:wrap;}
  footer nav a{font-family:var(--sans);font-size:.78rem;color:var(--brown);letter-spacing:.06em;}
  footer nav a:hover{color:var(--gold-deep);}
  .foot-note{width:100%;margin-top:30px;font-size:.72rem;color:var(--brown-soft);font-family:var(--sans);letter-spacing:.04em;}

  .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease, transform .7s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  @media (max-width:860px){
    nav.mainnav{
      position:fixed;top:64px;right:0;background:var(--cream-2);flex-direction:column;align-items:flex-start;
      gap:0;width:220px;border-left:1px solid rgba(28,20,11,.14);border-bottom:1px solid rgba(28,20,11,.14);
      transform:translateX(100%);transition:transform .35s ease;
    }
    nav.mainnav.open{transform:translateX(0);}
    nav.mainnav a{padding:16px 24px;width:100%;border-bottom:1px solid rgba(28,20,11,.08);}
    .menu-toggle{display:flex;}
    .gallery-grid{grid-template-columns:repeat(2, 1fr);}
    .gallery-grid .tall{grid-row:span 1;}
  }
  @media (max-width:520px){
    .gallery-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="brand">
    <svg class="mark" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
      <path d="M50,12 C46,7 53,2 58,6 C62,10 57,15 51,13" fill="#1c140b"/>
      <circle cx="50" cy="30" r="16" fill="#efe3c2" stroke="#1c140b" stroke-width="3.5"/>
      <circle cx="44" cy="30" r="1.8" fill="#1c140b"/>
      <circle cx="56" cy="30" r="1.8" fill="#1c140b"/>
      <path d="M45,36 Q50,40 55,36" stroke="#1c140b" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M28,52 C20,66 20,86 32,98 C40,105 60,105 68,98 C80,86 80,66 72,52 C64,45 36,45 28,52 Z" fill="#efe3c2" stroke="#1c140b" stroke-width="3.5"/>
      <path d="M24,75 Q50,84 76,75" stroke="#d99a1f" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>
    <span class="label">
      <span class="ja">土俵の書</span>
      <span class="en">SUMO STUDY NOTES</span>
    </span>
  </a>
  <button class="menu-toggle" id="menuToggle" aria-label="メニューを開く"><span></span><span></span><span></span></button>
  <nav class="mainnav" id="mainnav">
    <a href="index.html">ホーム</a>
    <a href="blog.html">日誌</a>
    <a href="gallery.html" class="current">画帖</a>
    <a href="about.html">について</a>
  </nav>
</header>

<div class="page-header">
  <div class="wrap">
    <span class="eyebrow">絵と記録</span>
    <h1>画帖</h1>
    <p>取組の一場面、力士の姿、波と土俵をめぐるスケッチを少しずつ増やしていく画帖。まだ空の枠が多いけれど、これから埋めていく。</p>
    <svg class="header-strip" width="140" height="18" viewBox="0 0 140 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,10 C15,2 25,16 40,9 C55,2 65,16 80,9 C95,2 105,16 120,9 C128,6 134,10 140,7"
            fill="none" stroke="#1c140b" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </svg>
  </div>
</div>

<section>
  <div class="wrap">

    <div class="gallery-grid reveal">

      <!-- 1: 立ち合い -->
      <div class="frame tall">
        <svg class="icon" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="#1c140b" stroke-width="2"/><path d="M14,30 Q30,14 46,30 Q30,46 14,30 Z" fill="none" stroke="#d99a1f" stroke-width="2"/></svg>
        <span class="tag">立ち合い</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 2: まわし -->
      <div class="frame">
        <svg class="icon" viewBox="0 0 60 60"><rect x="16" y="24" width="28" height="14" rx="4" fill="none" stroke="#1c140b" stroke-width="2"/><path d="M12,31 Q30,42 48,31" fill="none" stroke="#d99a1f" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="tag">まわし</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 3: 軍配 -->
      <div class="frame">
        <svg class="icon" viewBox="0 0 60 60"><path d="M30,12 C42,12 48,22 44,32 C40,40 30,42 30,42 C30,42 20,40 16,32 C12,22 18,12 30,12 Z" fill="none" stroke="#1c140b" stroke-width="2"/><line x1="30" y1="42" x2="30" y2="52" stroke="#d99a1f" stroke-width="2.5"/></svg>
        <span class="tag">軍配</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 4: 波と土俵 -->
      <div class="frame tall">
        <svg class="icon" viewBox="0 0 60 60"><path d="M8,38 C16,30 22,42 30,34 C38,26 42,20 52,16" fill="none" stroke="#1c140b" stroke-width="2.4" stroke-linecap="round"/><circle cx="30" cy="46" r="3" fill="#d99a1f"/></svg>
        <span class="tag">波と土俵</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 5: 番付表 -->
      <div class="frame">
        <svg class="icon" viewBox="0 0 60 60"><rect x="14" y="10" width="32" height="40" fill="none" stroke="#1c140b" stroke-width="2"/><line x1="20" y1="20" x2="40" y2="20" stroke="#d99a1f" stroke-width="2"/><line x1="20" y1="28" x2="40" y2="28" stroke="#1c140b" stroke-width="1.4" opacity=".6"/><line x1="20" y1="36" x2="40" y2="36" stroke="#1c140b" stroke-width="1.4" opacity=".6"/></svg>
        <span class="tag">番付表</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 6: 太鼓 -->
      <div class="frame">
        <svg class="icon" viewBox="0 0 60 60"><ellipse cx="30" cy="30" rx="18" ry="12" fill="none" stroke="#1c140b" stroke-width="2"/><line x1="15" y1="24" x2="15" y2="36" stroke="#d99a1f" stroke-width="2"/><line x1="45" y1="24" x2="45" y2="36" stroke="#d99a1f" stroke-width="2"/></svg>
        <span class="tag">太鼓</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 7: 力士のスケッチ -->
      <div class="frame tall">
        <svg class="icon" viewBox="0 0 60 60"><circle cx="30" cy="18" r="9" fill="none" stroke="#1c140b" stroke-width="2"/><path d="M16,50 C16,36 22,28 30,28 C38,28 44,36 44,50" fill="none" stroke="#1c140b" stroke-width="2"/><path d="M20,38 Q30,44 40,38" stroke="#d99a1f" stroke-width="2.4" fill="none"/></svg>
        <span class="tag">力士のスケッチ</span>
        <span class="cap">準備中</span>
      </div>

      <!-- 8: 綱 -->
      <div class="frame">
        <svg class="icon" viewBox="0 0 60 60"><circle cx="30" cy="30" r="18" fill="none" stroke="#1c140b" stroke-width="2" stroke-dasharray="3 5"/><circle cx="30" cy="30" r="4" fill="#d99a1f"/></svg>
        <span class="tag">綱</span>
        <span class="cap">準備中</span>
      </div>

    </div>

    <div class="note-box reveal">
      <p>まだ空の枠ばかりだけれど、観戦やスケッチを重ねながら、少しずつここに絵を増やしていく予定。</p>
    </div>

  </div>
</section>

<footer>
  <div class="wrap">
    <a href="index.html" class="brand"><span class="label"><span class="ja">土俵の書</span></span></a>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="blog.html">日誌</a>
      <a href="gallery.html">画帖</a>
      <a href="about.html">について</a>
    </nav>
    <p class="foot-note">© 土俵の書 — 個人の相撲学習ノートです。</p>
  </div>
</footer>

<script>
  const toggle = document.getElementById('menuToggle');
  const nav = document.getElementById('mainnav');
  toggle.addEventListener('click', () => nav.classList.toggle('open'));
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('open')));

  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
    });
  }, { threshold: 0.15 });
  revealEls.forEach(el => io.observe(el));
</script>

</body>
</html>
